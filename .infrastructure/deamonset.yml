apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp
  namespace: my-namespace
  labels:
    app: todoapp
spec:
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: busyboxplus
          image: ikulyk404/busyboxplus:curl
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                date
                curl -sS http://todoapp-service/
                sleep 5
              done
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
          ports:
            - containerPort: 80
              hostPort: 30008
