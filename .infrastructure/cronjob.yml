apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob
  namespace: my-namespace
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: busyboxplus
              image: ikulyk404/busyboxplus:curl
              command:
                - /bin/sh
                - -c
                - curl -sS http://todoapp-service/api/health
              resources:
                requests:
                  cpu: "100m"
                  memory: "100Mi"
                limits:
                  cpu: "200m"
                  memory: "200Mi"
          restartPolicy: OnFailure